<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM &amp; SM — Sep 2026 MTP &amp; RTP</title>
<script>document.documentElement.setAttribute('data-theme','light');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,650&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1ea; --bg-elev:#f8faf5; --card:#ffffff;
    --ink:#1c2420; --ink-soft:#57604f; --ink-faint:#8a9284;
    --line:#d3d9c9; --line-strong:#b7c0ac;
    --brand:#2b3a67; --brand-ink:#ffffff; --brand-soft:#e7eaf4;
    --gold:#a5751f; --gold-soft:#f3e9d3;
    --teal:#2b6f68; --teal-soft:#e2eeec;
    --ok:#3d6b3f; --ok-soft:#e6efe3;
    --bad:#a8271a; --bad-soft:#f8e5e1;
    --shadow: 0 12px 28px -16px rgba(28,36,32,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14180f; --bg-elev:#191e13; --card:#1e2417;
      --ink:#eef1e6; --ink-soft:#aab2a0; --ink-faint:#727a68;
      --line:#2c3324; --line-strong:#3a4330;
      --brand:#93a2dc; --brand-ink:#12162a; --brand-soft:#232a44;
      --gold:#d9a54c; --gold-soft:#332912;
      --teal:#6fbdb5; --teal-soft:#152825;
      --ok:#86c886; --ok-soft:#1c2b1c;
      --bad:#e2695a; --bad-soft:#3a1f1a;
      --shadow: 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14180f; --bg-elev:#191e13; --card:#1e2417;
    --ink:#eef1e6; --ink-soft:#aab2a0; --ink-faint:#727a68;
    --line:#2c3324; --line-strong:#3a4330;
    --brand:#93a2dc; --brand-ink:#12162a; --brand-soft:#232a44;
    --gold:#d9a54c; --gold-soft:#332912;
    --teal:#6fbdb5; --teal-soft:#152825;
    --ok:#86c886; --ok-soft:#1c2b1c;
    --bad:#e2695a; --bad-soft:#3a1f1a;
    --shadow: 0 12px 28px -14px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{ background:var(--bg); color:var(--ink); font-family:"Source Serif 4",Georgia,serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:"Fraunces",Georgia,serif; }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; }

  #app{ display:grid; grid-template-rows:auto auto 1fr; height:100vh; }

  header.top{ display:flex; align-items:center; gap:14px; padding:11px 18px; border-bottom:1px solid var(--line); background:var(--bg-elev); flex-wrap:wrap; }
  .stamp{ width:40px; height:40px; border-radius:50%; border:2px solid var(--brand); color:var(--brand); display:flex; align-items:center; justify-content:center; font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:12px; transform:rotate(-8deg); flex:none; }
  .brandwrap{ display:flex; flex-direction:column; line-height:1.15; margin-right:auto; }
  .brandwrap .name{ font-size:17px; font-weight:650; }
  .brandwrap .tag{ font-size:11px; color:var(--ink-soft); }

  .seg{ display:flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; }
  .seg button{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:500; padding:7px 13px; border:none; background:var(--card); color:var(--ink-soft); cursor:pointer; }
  .seg button + button{ border-left:1px solid var(--line-strong); }
  .seg button.active{ background:var(--brand); color:var(--brand-ink); }
  .seg button:disabled{ opacity:.35; cursor:not-allowed; }

  .filterbar{ display:flex; gap:8px; align-items:center; padding:8px 18px; border-bottom:1px solid var(--line); background:var(--bg-elev); flex-wrap:wrap; }
  .filterbar .lbl{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }
  .chip{ font-family:"IBM Plex Mono",monospace; font-size:11px; padding:5px 11px; border-radius:20px; border:1px solid var(--line-strong); background:var(--card); color:var(--ink-soft); cursor:pointer; }
  .chip.active{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }

  .shell{ display:grid; grid-template-columns:290px 1fr; min-height:0; }
  nav.chapters{ border-right:1px solid var(--line); background:var(--bg-elev); overflow-y:auto; padding:14px 10px; }
  .chapter-row{ display:flex; align-items:flex-start; gap:9px; width:100%; text-align:left; padding:9px 10px; border-radius:9px; background:none; border:none; cursor:pointer; color:var(--ink); margin-bottom:2px; }
  .chapter-row:hover{ background:var(--card); }
  .chapter-row.active{ background:var(--brand-soft); }
  .chapter-row .num{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-faint); width:22px; flex:none; padding-top:2px; }
  .chapter-row .cname{ font-size:12.5px; line-height:1.3; }
  .chapter-row .csub{ font-size:10px; color:var(--ink-faint); margin-top:2px; font-family:"IBM Plex Mono",monospace; }

  main.content{ overflow-y:auto; padding:22px 28px 70px; }
  .chapter-head{ max-width:820px; margin:0 auto 16px; }
  .chapter-head .kicker{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.08em; color:var(--gold); text-transform:uppercase; margin-bottom:4px; }
  .chapter-head h1{ font-size:22px; font-weight:650; margin:0; }

  /* MCQ */
  .mcqlist{ max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .mcq{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:15px 18px; box-shadow:var(--shadow); }
  .srcpill{ font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:600; padding:3px 8px; border-radius:5px; background:var(--brand-soft); color:var(--brand); letter-spacing:.03em; }
  .srcpill.rtp{ background:var(--teal-soft); color:var(--teal); }
  .srcpill.mtp1{ background:var(--gold-soft); color:var(--gold); }
  .scenario{ font-size:12.5px; line-height:1.55; color:var(--ink-soft); background:var(--bg-elev); border:1px solid var(--line); border-radius:9px; padding:10px 13px; margin:9px 0; }
  .scenario p{ margin:0 0 7px; } .scenario p:last-child{ margin:0; }
  .scenario.collapsed{ max-height:104px; overflow:hidden; -webkit-mask-image:linear-gradient(#000 55%, transparent); mask-image:linear-gradient(#000 55%, transparent); }
  .scentoggle{ font-family:"IBM Plex Mono",monospace; font-size:10px; background:none; border:none; color:var(--brand); cursor:pointer; padding:2px 0 8px; }
  .qtext{ font-size:14.5px; line-height:1.5; font-weight:600; margin:8px 0 11px; }
  .opts{ display:flex; flex-direction:column; gap:7px; }
  .opt{ display:flex; gap:9px; align-items:flex-start; text-align:left; width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:9px; background:var(--card); color:var(--ink); cursor:pointer; font-family:inherit; font-size:13px; line-height:1.45; }
  .opt:hover:not(.locked){ border-color:var(--brand); }
  .opt .key{ font-family:"IBM Plex Mono",monospace; font-weight:600; flex:none; }
  .opt.locked{ cursor:default; }
  .opt.correct{ background:var(--ok-soft); border-color:var(--ok); }
  .opt.wrong{ background:var(--bad-soft); border-color:var(--bad); }
  .opt .mark{ margin-left:auto; font-weight:700; flex:none; }
  .opt.correct .mark{ color:var(--ok); } .opt.wrong .mark{ color:var(--bad); }
  .ansline{ font-family:"IBM Plex Mono",monospace; font-size:11px; margin-top:9px; color:var(--ok); }

  /* Formula */
  .flist{ max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .fcard{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 17px; box-shadow:var(--shadow); }
  .fcard .ftitle{ font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:15px; color:var(--brand); margin-bottom:6px; }
  .fcard .eq{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; background:var(--bg-elev); border:1px solid var(--line); border-radius:8px; padding:9px 12px; margin:7px 0; overflow-x:auto; line-height:2; }
  .fr{ display:inline-flex; flex-direction:column; text-align:center; vertical-align:middle; margin:0 .18em; }
  .fr>span{ padding:0 .4em; }
  .fr>span:first-child{ border-bottom:1.5px solid currentColor; }

  /* descriptive list + reader */
  .qlist{ max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:9px; }
  .qcard{ display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; box-shadow:var(--shadow); border-left:3px solid var(--line); }
  .qcard:hover{ border-color:var(--line-strong); }
  .qcard .qn{ font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:15px; color:var(--ink-faint); width:24px; flex:none; }
  .qcard .qmeta{ flex:1; min-width:0; }
  .qcard .row1{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .pill{ font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:500; padding:2.5px 6px; border-radius:5px; white-space:nowrap; }
  .pill.mtp2{ background:var(--brand-soft); color:var(--brand); }
  .pill.mtp1{ background:var(--gold-soft); color:var(--gold); }
  .pill.rtp{ background:var(--teal-soft); color:var(--teal); }
  .pill.marks{ background:var(--bg); color:var(--ink-soft); border:1px solid var(--line); }
  .qcard .snippet{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60ch; }
  .chevron{ color:var(--ink-faint); flex:none; }

  #reader{ position:fixed; inset:0; background:var(--bg); z-index:50; display:none; flex-direction:column; }
  #reader.open{ display:flex; }
  .reader-head{ display:flex; align-items:center; gap:12px; padding:13px 20px; border-bottom:1px solid var(--line); background:var(--bg-elev); flex:none; }
  .reader-head .rmeta{ flex:1; min-width:0; }
  .reader-head .rchap{ font-size:10.5px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; }
  .reader-head .rtitle{ font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:15.5px; }
  .iconbtn{ border:1px solid var(--line-strong); background:var(--card); color:var(--ink); width:33px; height:33px; border-radius:8px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; flex:none; }
  .iconbtn:hover{ border-color:var(--brand); color:var(--brand); }
  .iconbtn:disabled{ opacity:.35; cursor:default; }
  .reader-body{ flex:1; overflow-y:auto; padding:30px 20px 90px; }
  .reader-inner{ max-width:720px; margin:0 auto; }
  .rlabel{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--brand); border-bottom:2px solid var(--brand); display:inline-block; padding-bottom:3px; margin-bottom:14px; }
  .rlabel.a{ color:var(--ok); border-color:var(--ok); }
  .qbody, .abody{ font-size:14.5px; line-height:1.66; }
  .qbody p, .abody p{ margin:0 0 11px; }
  .qbody ul, .qbody ol, .abody ul, .abody ol{ margin:0 0 11px; padding-left:20px; }
  .qbody li, .abody li{ margin-bottom:5px; }
  .qbody table, .abody table, .fcard table{ border-collapse:collapse; width:100%; margin:12px 0; font-size:12.5px; }
  .qbody td, .qbody th, .abody td, .abody th, .fcard td, .fcard th{ border:1px solid var(--line-strong); padding:5px 8px; text-align:left; vertical-align:top; }
  .qbody th, .abody th, .fcard th{ background:var(--brand-soft); }
  .reveal-wrap{ text-align:center; margin:26px 0; }
  .reveal-btn{ font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:11px 24px; border-radius:30px; cursor:pointer; background:var(--brand); color:var(--brand-ink); border:none; box-shadow:var(--shadow); }
  .answer-block{ display:none; margin-top:8px; padding-top:20px; border-top:1px dashed var(--line-strong); }
  .answer-block.shown{ display:block; }
  .reader-nav{ position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center; gap:10px; padding:13px; background:linear-gradient(to top, var(--bg) 60%, transparent); }
  .navbtn{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; padding:9px 17px; border-radius:24px; border:1px solid var(--line-strong); background:var(--card); color:var(--ink); cursor:pointer; }
  .navbtn:disabled{ opacity:.35; cursor:default; }

  .empty{ max-width:640px; margin:48px auto; text-align:center; color:var(--ink-soft); font-size:13px; }

  @media (max-width:880px){
    .shell{ grid-template-columns:1fr; }
    nav.chapters{ display:none; }
    nav.chapters.mobopen{ display:block; position:fixed; inset:150px 0 0 0; z-index:40; }
    .mobnav{ display:inline-flex !important; }
  }
  .mobnav{ display:none; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="stamp">FM<br>SM</div>
    <div class="brandwrap">
      <div class="name">FM &amp; SM — Sep 2026</div>
      <div class="tag">CA Inter · MTP 1 + MTP 2 + RTP + FM Formula Sheet · chapter-wise</div>
    </div>
    <button class="chip mobnav" id="mobNavBtn">☰ Chapters</button>
    <div class="seg" id="subjToggle">
      <button data-subj="fm" class="active">FM</button>
      <button data-subj="sm">SM</button>
    </div>
    <div class="seg" id="modeToggle">
      <button data-mode="mcq" class="active">MCQ</button>
      <button data-mode="desc">Descriptive</button>
      <button data-mode="formula">Formula</button>
    </div>
  </header>

  <div class="filterbar" id="filterBar">
    <span class="lbl">Source</span>
    <button class="chip active" data-src="ALL">All</button>
    <button class="chip" data-src="MTP1">MTP 1</button>
    <button class="chip" data-src="MTP2">MTP 2</button>
    <button class="chip" data-src="RTP">RTP</button>
  </div>

  <div class="shell">
    <nav class="chapters" id="chapterNav"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="reader">
  <div class="reader-head">
    <button class="iconbtn" id="closeBtn">&#10005;</button>
    <div class="rmeta"><div class="rchap" id="rChap"></div><div class="rtitle" id="rTitle"></div></div>
    <button class="iconbtn" id="prevBtn">&#8592;</button>
    <button class="iconbtn" id="nextBtn">&#8594;</button>
  </div>
  <div class="reader-body"><div class="reader-inner">
    <div class="rlabel">Question</div>
    <div class="qbody" id="qBody"></div>
    <div class="reveal-wrap" id="revealWrap"><button class="reveal-btn" id="revealBtn">Tap to reveal answer</button></div>
    <div class="answer-block" id="answerBlock">
      <div class="rlabel a">Suggested Answer / Hint</div>
      <div class="abody" id="aBody"></div>
    </div>
  </div></div>
  <div class="reader-nav">
    <button class="navbtn" id="navPrev">&#8592; Previous</button>
    <button class="navbtn" id="navNext">Next &#8594;</button>
  </div>
</div>

const DATA = JSON.parse(new TextDecoder('utf-8').decode(Uint8Array.from(atob(B64), c=>c.charCodeAt(0))));

let state = { subj:'fm', mode:'mcq', src:'ALL', chapterIdx:0, qIdx:0 };
try{ const s = JSON.parse(localStorage.getItem('fmsm26_state')||'null'); if(s) state = Object.assign(state, s); }catch(e){}
function save(){ try{ localStorage.setItem('fmsm26_state', JSON.stringify(state)); }catch(e){} }

function subjData(){ return DATA[state.subj] || {}; }
function groups(){
  const d = subjData();
  if(state.mode==='mcq') return d.mcq || [];
  if(state.mode==='formula') return d.formula || [];
  return d.desc || [];
}
function srcMatch(it){ return state.mode==='formula' || state.src==='ALL' || it.source===state.src; }
function visibleGroups(){
  return groups().map(g => ({...g, items: g.items.filter(srcMatch)})).filter(g => g.items.length);
}
function currentGroup(){ const v = visibleGroups(); return v[Math.min(state.chapterIdx, v.length-1)] || null; }
function srcClass(s){ return s==='RTP'?'rtp':(s==='MTP1'?'mtp1':'mtp2'); }
function srcLabel(s){ return s==='RTP'?'RTP':(s==='MTP1'?'MTP 1':'MTP 2'); }

function syncMode(){
  const formBtn = document.querySelector('#modeToggle button[data-mode="formula"]');
  const hasFormula = (subjData().formula || []).length > 0;
  formBtn.disabled = !hasFormula;
  if(state.mode==='formula' && !hasFormula){ state.mode='mcq'; }
  document.querySelectorAll('#modeToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode===state.mode));
  document.querySelectorAll('#subjToggle button').forEach(b => b.classList.toggle('active', b.dataset.subj===state.subj));
  document.querySelectorAll('#filterBar .chip').forEach(b => b.classList.toggle('active', b.dataset.src===state.src));
  document.getElementById('filterBar').style.opacity = state.mode==='formula' ? .45 : 1;
  document.getElementById('filterBar').style.pointerEvents = state.mode==='formula' ? 'none' : 'auto';
}

function renderNav(){
  const nav = document.getElementById('chapterNav');
  const v = visibleGroups();
  nav.innerHTML = '';
  v.forEach((g,i) => {
    const b = document.createElement('button');
    b.className = 'chapter-row' + (i===state.chapterIdx?' active':'');
    const unit = state.mode==='mcq'?'MCQ':(state.mode==='formula'?'set':'Q');
    b.innerHTML = `<span class="num mono">${String(g.num).padStart(2,'0')}</span>
      <span><span class="cname">${g.name}</span><span class="csub">${g.items.length} ${unit}${g.items.length>1?'s':''}</span></span>`;
    b.onclick = () => { state.chapterIdx = i; state.qIdx = 0; save(); render(); document.getElementById('chapterNav').classList.remove('mobopen'); };
    nav.appendChild(b);
  });
}

function render(){
  syncMode(); renderNav();
  const g = currentGroup();
  const main = document.getElementById('content');
  if(!g){ main.innerHTML = '<div class="empty">Nothing here for this filter.</div>'; return; }
  const kicker = `${g.name} · ${state.subj==='fm'?'Financial Management':'Strategic Management'}`;
  if(state.mode==='formula'){
    main.innerHTML = `<div class="chapter-head"><div class="kicker">Formula Sheet</div><h1>${g.name}</h1></div><div class="flist" id="flist"></div>`;
    const wrap = document.getElementById('flist');
    g.items.forEach(f => { const d = document.createElement('div'); d.className='fcard';
      d.innerHTML = (f.title?`<div class="ftitle">${f.title}</div>`:'') + f.body; wrap.appendChild(d); });
  } else if(state.mode==='mcq'){
    main.innerHTML = `<div class="chapter-head"><div class="kicker">${kicker}</div><h1>MCQs</h1></div><div class="mcqlist" id="mcqlist"></div>`;
    const wrap = document.getElementById('mcqlist');
    g.items.forEach(m => wrap.appendChild(mcqEl(m)));
  } else {
    const items = g.items.map((q,i) => `<div class="qcard" data-i="${i}">
      <span class="qn mono">${i+1}</span>
      <span class="qmeta"><span class="row1">
        <span class="pill ${srcClass(q.source)}">${srcLabel(q.source)}</span>
        <span class="pill marks">${q.qno}${q.marks?' · '+q.marks+'m':''}</span>
      </span><div class="snippet">${q.q.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,110)}…</div></span>
      <span class="chevron">&#8594;</span></div>`).join('');
    main.innerHTML = `<div class="chapter-head"><div class="kicker">${kicker}</div><h1>Descriptive</h1></div><div class="qlist">${items}</div>`;
    main.querySelectorAll('.qcard').forEach(el => el.onclick = () => openReader(parseInt(el.dataset.i,10)));
  }
  main.scrollTop = 0;
}

function mcqEl(m){
  const d = document.createElement('div');
  d.className = 'mcq';
  const keys = ['a','b','c','d'];
  const uid = state.subj + '_' + state.mode + '_' + m.n;
  d.innerHTML = `<span class="srcpill ${srcClass(m.source)}">${srcLabel(m.source)} · MCQ ${m.n}</span>
    ${m.scenario ? `<div class="scenario collapsed" id="sc${uid}">${m.scenario}</div><button class="scentoggle">▼ Show full case scenario</button>` : ''}
    <div class="qtext">${m.q}</div>
    <div class="opts">${keys.map(k=>`<button class="opt" data-k="${k}"><span class="key">(${k})</span><span>${m.opts[k]}</span></button>`).join('')}</div>
    <div class="ansline" hidden></div>`;
  const sc = d.querySelector('.scentoggle');
  if(sc) sc.onclick = () => {
    const box = d.querySelector('#sc'+uid);
    box.classList.toggle('collapsed');
    sc.textContent = box.classList.contains('collapsed') ? '▼ Show full case scenario' : '▲ Hide case scenario';
  };
  d.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      if(d.querySelector('.opt.locked')) return;
      d.querySelectorAll('.opt').forEach(o => {
        o.classList.add('locked');
        if(o.dataset.k === m.correct){ o.classList.add('correct'); o.insertAdjacentHTML('beforeend','<span class="mark">✓</span>'); }
      });
      if(btn.dataset.k !== m.correct){ btn.classList.add('wrong'); btn.insertAdjacentHTML('beforeend','<span class="mark">✗</span>'); }
      const al = d.querySelector('.ansline'); al.hidden = false; al.textContent = 'Correct answer: (' + m.correct + ')';
    };
  });
  return d;
}

const reader = document.getElementById('reader');
function openReader(i){ state.qIdx = i; save(); document.body.style.overflow='hidden'; reader.classList.add('open'); renderReader(); }
function closeReader(){ reader.classList.remove('open'); document.body.style.overflow=''; }
function renderReader(){
  const g = currentGroup(); const q = g.items[state.qIdx];
  document.getElementById('rChap').textContent = g.name + '  ·  ' + srcLabel(q.source);
  document.getElementById('rTitle').textContent = `${srcLabel(q.source)} — ${q.qno}${q.marks?' ('+q.marks+' Marks)':''}`;
  document.getElementById('qBody').innerHTML = q.q;
  document.getElementById('aBody').innerHTML = q.a;
  document.getElementById('answerBlock').classList.remove('shown');
  document.getElementById('revealWrap').style.display = '';
  document.getElementById('prevBtn').disabled = state.qIdx===0;
  document.getElementById('nextBtn').disabled = state.qIdx===g.items.length-1;
  document.getElementById('navPrev').disabled = state.qIdx===0;
  document.getElementById('navNext').disabled = state.qIdx===g.items.length-1;
  document.querySelector('.reader-body').scrollTop = 0;
}
document.getElementById('revealBtn').onclick = () => {
  document.getElementById('answerBlock').classList.add('shown');
  document.getElementById('revealWrap').style.display='none';
  document.getElementById('answerBlock').scrollIntoView({behavior:'smooth',block:'start'});
};
document.getElementById('closeBtn').onclick = closeReader;
function step(d){ const g=currentGroup(); const n=state.qIdx+d; if(n<0||n>=g.items.length) return; state.qIdx=n; save(); renderReader(); }
['prevBtn','navPrev'].forEach(id=>document.getElementById(id).onclick=()=>step(-1));
['nextBtn','navNext'].forEach(id=>document.getElementById(id).onclick=()=>step(1));
document.addEventListener('keydown', e => { if(!reader.classList.contains('open')) return; if(e.key==='Escape') closeReader(); if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1); });

document.getElementById('subjToggle').onclick = e => {
  const b = e.target.closest('button[data-subj]'); if(!b) return;
  state.subj = b.dataset.subj; state.chapterIdx = 0; state.qIdx = 0; save(); render();
};
document.getElementById('modeToggle').onclick = e => {
  const b = e.target.closest('button[data-mode]'); if(!b || b.disabled) return;
  state.mode = b.dataset.mode; state.chapterIdx = 0; state.qIdx = 0; save(); render();
};
document.getElementById('filterBar').onclick = e => {
  const b = e.target.closest('button[data-src]'); if(!b) return;
  state.src = b.dataset.src; state.chapterIdx = 0; state.qIdx = 0; save(); render();
};
document.getElementById('mobNavBtn').onclick = () => document.getElementById('chapterNav').classList.toggle('mobopen');

render();
</script>
</body>
</html>
