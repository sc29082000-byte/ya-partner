<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vijay Preparation</title>
<script>document.documentElement.setAttribute('data-theme','light');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,650&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1ea; --bg-elev:#f8faf5; --card:#ffffff;
    --ink:#1c2420; --ink-soft:#57604f; --ink-faint:#8a9284;
    --line:#d3d9c9; --line-strong:#b7c0ac;
    --brand:#2b3a67; --brand-ink:#ffffff; --brand-soft:#e7eaf4;
    --gold:#a5751f; --gold-soft:#f3e9d3;
    --teal:#2b6f68; --teal-soft:#e2eeec;
    --must:#a8271a; --must-soft:#f8e5e1; --must-ink:#ffffff;
    --high:#93610d; --high-soft:#f7ecd3; --high-ink:#ffffff;
    --come:#3d6b3f; --come-soft:#e6efe3;
    --shadow: 0 12px 28px -16px rgba(28,36,32,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14180f; --bg-elev:#191e13; --card:#1e2417;
      --ink:#eef1e6; --ink-soft:#aab2a0; --ink-faint:#727a68;
      --line:#2c3324; --line-strong:#3a4330;
      --brand:#93a2dc; --brand-ink:#12162a; --brand-soft:#232a44;
      --gold:#d9a54c; --gold-soft:#332912;
      --teal:#6fbdb5; --teal-soft:#152825;
      --must:#e2695a; --must-soft:#3a1f1a; --must-ink:#1c0a07;
      --high:#e0b458; --high-soft:#332a12; --high-ink:#241a03;
      --come:#86c886; --come-soft:#1c2b1c;
      --shadow: 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14180f; --bg-elev:#191e13; --card:#1e2417;
    --ink:#eef1e6; --ink-soft:#aab2a0; --ink-faint:#727a68;
    --line:#2c3324; --line-strong:#3a4330;
    --brand:#93a2dc; --brand-ink:#12162a; --brand-soft:#232a44;
    --gold:#d9a54c; --gold-soft:#332912;
    --teal:#6fbdb5; --teal-soft:#152825;
    --must:#e2695a; --must-soft:#3a1f1a; --must-ink:#1c0a07;
    --high:#e0b458; --high-soft:#332a12; --high-ink:#241a03;
    --come:#86c886; --come-soft:#1c2b1c;
    --shadow: 0 12px 28px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Source Serif 4",Georgia,serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold-soft); }

  h1,h2,h3,.display{ font-family:"Fraunces",Georgia,serif; text-wrap:balance; }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  /* ---------- password gate ---------- */
  #gate{ position:fixed; inset:0; background:var(--bg); z-index:200; display:flex; align-items:center; justify-content:center; }
  #gate .box{ background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:34px 32px; text-align:center; max-width:320px; width:90%; }
  #gate .stamp{ width:46px; height:46px; border-radius:50%; border:2px solid var(--brand); color:var(--brand); display:flex; align-items:center; justify-content:center; font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:15px; transform:rotate(-8deg); margin:0 auto 14px; }
  #gate h2{ margin:0 0 4px; font-size:20px; }
  #gate p.sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; }
  #gate input{ width:100%; padding:11px 13px; border-radius:8px; border:1px solid var(--line-strong); background:var(--bg-elev); color:var(--ink); font-size:15px; font-family:"IBM Plex Mono",monospace; margin-bottom:10px; }
  #gate button{ width:100%; padding:11px; border-radius:8px; border:none; background:var(--brand); color:var(--brand-ink); font-weight:600; font-size:14px; cursor:pointer; font-family:"IBM Plex Mono",monospace; letter-spacing:.03em; }
  #gate button:hover{ filter:brightness(1.1); }
  #gate .err{ color:var(--must); font-size:12px; min-height:16px; margin-top:8px; }

  #app{ display:none; grid-template-rows:auto 1fr; height:100vh; }

  /* ---------- header ---------- */
  header.top{
    display:flex; align-items:center; gap:16px;
    padding:12px 20px; border-bottom:1px solid var(--line);
    background:var(--bg-elev);
  }
  .stamp{
    width:42px; height:42px; border-radius:50%;
    border:2px solid var(--brand); color:var(--brand);
    display:flex; align-items:center; justify-content:center;
    font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:14px;
    transform:rotate(-8deg); letter-spacing:0.5px; flex:none;
  }
  .brandwrap{ display:flex; flex-direction:column; line-height:1.15; margin-right:auto; }
  .brandwrap .name{ font-size:19px; font-weight:650; }
  .brandwrap .tag{ font-size:11.5px; color:var(--ink-soft); letter-spacing:.02em; }

  /* ---------- body shell ---------- */
  .shell{ display:grid; grid-template-columns:280px 1fr; min-height:0; }

  nav.chapters{
    border-right:1px solid var(--line); background:var(--bg-elev);
    overflow-y:auto; padding:14px 10px;
  }
  .chapter-row{
    display:flex; align-items:flex-start; gap:9px;
    width:100%; text-align:left; padding:10px 10px; border-radius:9px;
    background:none; border:none; cursor:pointer; color:var(--ink);
    margin-bottom:2px;
  }
  .chapter-row:hover{ background:var(--card); }
  .chapter-row.active{ background:var(--brand-soft); }
  .chapter-row .num{
    font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-faint);
    width:20px; flex:none; padding-top:2px;
  }
  .chapter-row .meta{ flex:1; min-width:0; }
  .chapter-row .cname{ font-size:13.3px; line-height:1.32; }
  .chapter-row .csub{ font-size:10.8px; color:var(--ink-faint); margin-top:2px; font-family:"IBM Plex Mono",monospace; }

  main.content{ overflow-y:auto; padding:26px 34px 60px; }
  .chapter-head{ max-width:760px; margin:0 auto 22px; }
  .chapter-head .kicker{
    font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em;
    color:var(--gold); text-transform:uppercase; margin-bottom:4px;
  }
  .chapter-head h1{ font-size:26px; font-weight:650; margin:0 0 6px; }
  .chapter-head .csummary{ font-size:13px; color:var(--ink-soft); }

  .qlist{ max-width:760px; margin:22px auto 0; display:flex; flex-direction:column; gap:10px; }
  .qcard{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:13px 15px; cursor:pointer; box-shadow:var(--shadow);
    border-left:3px solid var(--line);
    transition:transform .12s ease;
  }
  .qcard:hover{ transform:translateY(-1px); border-color:var(--line-strong); }
  .qcard.combo{ border-left-color:var(--high); }
  .qcard .qn{ font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:16px; color:var(--ink-faint); width:28px; flex:none; }
  .qcard .qmeta{ flex:1; min-width:0; }
  .qcard .qmeta .row1{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .pill{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
    padding:2.5px 7px; border-radius:5px; letter-spacing:.02em; white-space:nowrap;
  }
  .pill.pyq{ background:var(--brand-soft); color:var(--brand); }
  .pill.rtp{ background:var(--teal-soft); color:var(--teal); }
  .pill.mtp{ background:var(--gold-soft); color:var(--gold); }
  .pill.marks{ background:var(--bg); color:var(--ink-soft); border:1px solid var(--line); }
  .qcard .snippet{ font-size:12px; color:var(--ink-soft); margin-top:4px; max-width:56ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tagpill{
    font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:600;
    padding:3px 8px; border-radius:20px; letter-spacing:.03em; white-space:nowrap;
  }
  .tagpill.high{ background:var(--high); color:var(--high-ink); }
  .chevron{ color:var(--ink-faint); flex:none; }

  .empty-state{ max-width:760px; margin:60px auto 0; text-align:center; color:var(--ink-soft); }
  .empty-state .big{ font-size:38px; margin-bottom:10px; }

  /* ---------- reader overlay ---------- */
  #reader{
    position:fixed; inset:0; background:var(--bg); z-index:50;
    display:none; flex-direction:column;
  }
  #reader.open{ display:flex; }
  .reader-head{
    display:flex; align-items:center; gap:12px; padding:14px 22px;
    border-bottom:1px solid var(--line); background:var(--bg-elev); flex:none;
  }
  .reader-head .rmeta{ flex:1; min-width:0; }
  .reader-head .rchap{ font-size:11px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; }
  .reader-head .rtitle{ font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:16.5px; }
  .iconbtn{
    border:1px solid var(--line-strong); background:var(--card); color:var(--ink);
    width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .iconbtn:hover{ border-color:var(--brand); color:var(--brand); }
  .iconbtn:disabled{ opacity:.35; cursor:default; }
  .iconbtn:disabled:hover{ border-color:var(--line-strong); color:var(--ink); }

  .reader-body{ flex:1; overflow-y:auto; padding:34px 22px 90px; }
  .reader-inner{ max-width:700px; margin:0 auto; }
  .rlabel{
    font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--brand); border-bottom:2px solid var(--brand); display:inline-block; padding-bottom:3px; margin-bottom:14px;
  }
  .rlabel.a{ color:var(--come); border-color:var(--come); }
  .qbody, .abody{ font-size:15.5px; line-height:1.68; }
  .qbody p, .abody p{ margin:0 0 12px; }
  .qbody table, .abody table{ border-collapse:collapse; width:100%; margin:14px 0; font-size:13.6px; }
  .qbody td, .qbody th, .abody td, .abody th{ border:1px solid var(--line-strong); padding:6px 9px; text-align:left; vertical-align:top; }
  .qbody th, .abody th{ background:var(--brand-soft); }
  .qbody strong, .abody strong{ font-weight:650; }
  .qbody em, .abody em{ color:var(--ink-soft); }

  .reveal-wrap{ text-align:center; margin:30px 0; }
  .reveal-btn{
    font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; padding:12px 26px; border-radius:30px; cursor:pointer;
    background:var(--brand); color:var(--brand-ink); border:none; box-shadow:var(--shadow);
  }
  .reveal-btn:hover{ filter:brightness(1.08); }
  .answer-block{ display:none; margin-top:8px; padding-top:22px; border-top:1px dashed var(--line-strong); }
  .answer-block.shown{ display:block; }

  .matchnote{
    display:flex; gap:9px; align-items:flex-start; margin-bottom:20px; padding:11px 14px;
    border-radius:8px; font-size:13px; line-height:1.5;
  }
  .matchnote.high{ background:var(--high-soft); color:var(--high); }

  .reader-nav{
    position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center; gap:10px;
    padding:14px; background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .navbtn{
    font-family:"IBM Plex Mono",monospace; font-size:12px; padding:9px 18px; border-radius:24px;
    border:1px solid var(--line-strong); background:var(--card); color:var(--ink); cursor:pointer;
  }
  .navbtn:disabled{ opacity:.35; cursor:default; }
  .navbtn:hover:not(:disabled){ border-color:var(--brand); color:var(--brand); }

  @media (max-width:820px){
    .shell{ grid-template-columns:1fr; }
    nav.chapters{ display:none; }
    nav.chapters.mobopen{ display:block; position:fixed; inset:56px 0 0 0; z-index:40; width:auto; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="stamp">VP</div>
    <h2>Vijay Preparation</h2>
    <p class="sub">Enter password to continue</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="off" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">Unlock</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="stamp">VP</div>
    <div class="brandwrap">
      <div class="name">Vijay Preparation</div>
      <div class="tag">Advanced Accounting — PYQ + RTP + MTP, May 2024 to Sep 2026</div>
    </div>
  </header>

  <div class="shell">
    <nav class="chapters" id="chapterNav"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="reader">
  <div class="reader-head">
    <button class="iconbtn" id="closeBtn" aria-label="Close">&#10005;</button>
    <div class="rmeta">
      <div class="rchap" id="rChap"></div>
      <div class="rtitle" id="rTitle"></div>
    </div>
    <button class="iconbtn" id="prevBtn" aria-label="Previous">&#8592;</button>
    <button class="iconbtn" id="nextBtn" aria-label="Next">&#8594;</button>
  </div>
  <div class="reader-body">
    <div class="reader-inner">
      <div id="matchNote"></div>
      <div class="rlabel">Question</div>
      <div class="qbody" id="qBody"></div>
      <div class="reveal-wrap" id="revealWrap">
        <button class="reveal-btn" id="revealBtn">Tap to reveal answer</button>
      </div>
      <div class="answer-block" id="answerBlock">
        <div class="rlabel a">Suggested Answer</div>
        <div class="abody" id="aBody"></div>
      </div>
    </div>
  </div>
  <div class="reader-nav">
    <button class="navbtn" id="navPrev">&#8592; Previous</button>
    <button class="navbtn" id="navNext">Next &#8594;</button>
  </div>
</div>

<script>
function checkPw(){
  var v = document.getElementById('pw').value;
  if(v === 'Vijay798'){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'grid';
    try{ sessionStorage.setItem('vijay_unlocked','1'); }catch(e){}
  } else {
    document.getElementById('err').textContent = 'Incorrect password';
  }
}

const _bytes = Uint8Array.from(atob(B64), c => c.charCodeAt(0));
const DATA = JSON.parse(new TextDecoder('utf-8').decode(_bytes)).AA;

let state = { chapterIdx: 0, qIdx: 0 };
try{
  const saved = JSON.parse(localStorage.getItem('vijay_state') || 'null');
  if(saved) state = saved;
}catch(e){}
function saveState(){ try{ localStorage.setItem('vijay_state', JSON.stringify(state)); }catch(e){} }

function currentChapter(){ return DATA[state.chapterIdx] || DATA[0]; }

function renderChapterNav(){
  const nav = document.getElementById('chapterNav');
  nav.innerHTML = '';
  DATA.forEach((c, idx) => {
    const btn = document.createElement('button');
    btn.className = 'chapter-row' + (idx === state.chapterIdx ? ' active' : '');
    btn.innerHTML = `
      <span class="num mono">${String(c.num).padStart(2,'0')}</span>
      <span class="meta">
        <span class="cname">${c.name}</span>
        <span class="csub">${c.count} question${c.count===1?'':'s'}</span>
      </span>
    `;
    btn.addEventListener('click', () => { state.chapterIdx = idx; state.qIdx = 0; saveState(); renderAll(); });
    nav.appendChild(btn);
  });
}

function snippetOf(q){
  const src = (q.questionHtml||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  return src.length > 100 ? src.slice(0,100) + '…' : src;
}

function pillClass(pt){
  if(pt === 'PYQ') return 'pyq';
  if(pt === 'RTP') return 'rtp';
  return 'mtp';
}

function renderContent(){
  const c = currentChapter();
  const main = document.getElementById('content');

  if(!c.questions.length){
    main.innerHTML = `
      <div class="chapter-head">
        <div class="kicker">Chapter ${String(c.num).padStart(2,'0')} — Advanced Accounting</div>
        <h1>${c.name}</h1>
      </div>
      <div class="empty-state">
        <div class="big">🛠️</div>
        <p>Questions for this chapter are being added — check back soon.</p>
      </div>
    `;
    main.scrollTop = 0;
    return;
  }

  const qlist = c.questions.map((q, i) => {
    return `<div class="qcard ${q.combo ? 'combo' : ''}" data-idx="${i}">
      <span class="qn mono">${q.n}</span>
      <span class="qmeta">
        <span class="row1">
          <span class="pill ${pillClass(q.paperType)}">${q.paperType} • ${q.session}</span>
          <span class="pill marks">${q.qno}${q.marks ? ' • ' + q.marks + 'm' : ''}</span>
          ${q.combo ? `<span class="tagpill high">⚡ Combined with ${q.combo}</span>` : ''}
        </span>
        <div class="snippet">${snippetOf(q)}</div>
      </span>
      <span class="chevron">&#8594;</span>
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="chapter-head">
      <div class="kicker">Chapter ${String(c.num).padStart(2,'0')} — Advanced Accounting</div>
      <h1>${c.name}</h1>
      <div class="csummary">${c.count} question${c.count===1?'':'s'} compiled from PYQ, RTP &amp; MTP — May 2024 to Sep 2026 (Study Material excluded)</div>
    </div>
    <div class="qlist">${qlist}</div>
  `;
  main.querySelectorAll('.qcard').forEach(el => {
    el.addEventListener('click', () => openReader(parseInt(el.dataset.idx, 10)));
  });
  main.scrollTop = 0;
}

function renderAll(){ renderChapterNav(); renderContent(); }

/* ---------------- reader overlay ---------------- */
const reader = document.getElementById('reader');

function openReader(qIdx){
  state.qIdx = qIdx; saveState();
  document.body.style.overflow = 'hidden';
  reader.classList.add('open');
  renderReader();
}
function closeReader(){
  reader.classList.remove('open');
  document.body.style.overflow = '';
}
function renderReader(){
  const c = currentChapter();
  const q = c.questions[state.qIdx];
  document.getElementById('rChap').textContent = `Advanced Accounting • ${c.name}`;
  document.getElementById('rTitle').textContent = `${q.paperType} ${q.session} — Question ${q.qno}${q.marks ? ' (' + q.marks + ' Marks)' : ''}`;
  document.getElementById('qBody').innerHTML = q.questionHtml || '';
  document.getElementById('aBody').innerHTML = q.answerHtml || '';

  const note = document.getElementById('matchNote');
  if(q.combo){
    note.innerHTML = `<div class="matchnote high">⚡ <span>Combined question — along with <strong>AS 2</strong>, this question also covers <strong>${q.combo}</strong>.${q.note ? '<br>'+q.note : ''}</span></div>`;
  } else {
    note.innerHTML = '';
  }

  document.getElementById('answerBlock').classList.remove('shown');
  document.getElementById('revealWrap').style.display = '';

  document.getElementById('prevBtn').disabled = state.qIdx === 0;
  document.getElementById('nextBtn').disabled = state.qIdx === c.questions.length - 1;
  document.getElementById('navPrev').disabled = state.qIdx === 0;
  document.getElementById('navNext').disabled = state.qIdx === c.questions.length - 1;
}

document.getElementById('revealBtn').addEventListener('click', () => {
  document.getElementById('answerBlock').classList.add('shown');
  document.getElementById('revealWrap').style.display = 'none';
  document.getElementById('answerBlock').scrollIntoView({behavior:'smooth', block:'start'});
});
document.getElementById('closeBtn').addEventListener('click', closeReader);
function step(delta){
  const c = currentChapter();
  const ni = state.qIdx + delta;
  if(ni < 0 || ni >= c.questions.length) return;
  state.qIdx = ni; saveState();
  renderReader();
  document.querySelector('.reader-body').scrollTop = 0;
}
document.getElementById('prevBtn').addEventListener('click', () => step(-1));
document.getElementById('nextBtn').addEventListener('click', () => step(1));
document.getElementById('navPrev').addEventListener('click', () => step(-1));
document.getElementById('navNext').addEventListener('click', () => step(1));
document.addEventListener('keydown', (e) => {
  if(!reader.classList.contains('open')) return;
  if(e.key === 'Escape') closeReader();
  if(e.key === 'ArrowLeft') step(-1);
  if(e.key === 'ArrowRight') step(1);
});

renderAll();
</script>
