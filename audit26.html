<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Sep 2026 MTP &amp; RTP</title>
<script>document.documentElement.setAttribute('data-theme','light');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,650&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1ea; --bg-elev:#f8faf5; --card:#ffffff;
    --ink:#1c2420; --ink-soft:#57604f; --ink-faint:#8a9284;
    --line:#d3d9c9; --line-strong:#b7c0ac;
    --brand:#2b3a67; --brand-ink:#ffffff; --brand-soft:#e7eaf4;
    --gold:#a5751f; --gold-soft:#f3e9d3;
    --teal:#2b6f68; --teal-soft:#e2eeec;
    --ok:#3d6b3f; --ok-soft:#e6efe3; --ok-ink:#ffffff;
    --bad:#a8271a; --bad-soft:#f8e5e1; --bad-ink:#ffffff;
    --shadow: 0 12px 28px -16px rgba(28,36,32,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14180f; --bg-elev:#191e13; --card:#1e2417;
      --ink:#eef1e6; --ink-soft:#aab2a0; --ink-faint:#727a68;
      --line:#2c3324; --line-strong:#3a4330;
      --brand:#93a2dc; --brand-ink:#12162a; --brand-soft:#232a44;
      --gold:#d9a54c; --gold-soft:#332912;
      --teal:#6fbdb5; --teal-soft:#152825;
      --ok:#86c886; --ok-soft:#1c2b1c; --ok-ink:#0a170a;
      --bad:#e2695a; --bad-soft:#3a1f1a; --bad-ink:#1c0a07;
      --shadow: 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14180f; --bg-elev:#191e13; --card:#1e2417;
    --ink:#eef1e6; --ink-soft:#aab2a0; --ink-faint:#727a68;
    --line:#2c3324; --line-strong:#3a4330;
    --brand:#93a2dc; --brand-ink:#12162a; --brand-soft:#232a44;
    --gold:#d9a54c; --gold-soft:#332912;
    --teal:#6fbdb5; --teal-soft:#152825;
    --ok:#86c886; --ok-soft:#1c2b1c; --ok-ink:#0a170a;
    --bad:#e2695a; --bad-soft:#3a1f1a; --bad-ink:#1c0a07;
    --shadow: 0 12px 28px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{ background:var(--bg); color:var(--ink); font-family:"Source Serif 4",Georgia,serif; -webkit-font-smoothing:antialiased; }
  ::selection{ background:var(--gold-soft); }
  h1,h2,h3{ font-family:"Fraunces",Georgia,serif; text-wrap:balance; }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  #app{ display:grid; grid-template-rows:auto auto 1fr; height:100vh; }

  header.top{ display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--bg-elev); flex-wrap:wrap; }
  .stamp{ width:42px; height:42px; border-radius:50%; border:2px solid var(--brand); color:var(--brand); display:flex; align-items:center; justify-content:center; font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:13px; transform:rotate(-8deg); flex:none; }
  .brandwrap{ display:flex; flex-direction:column; line-height:1.15; margin-right:auto; }
  .brandwrap .name{ font-size:18px; font-weight:650; }
  .brandwrap .tag{ font-size:11.5px; color:var(--ink-soft); }

  .seg{ display:flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; }
  .seg button{ font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:500; padding:7px 14px; border:none; background:var(--card); color:var(--ink-soft); cursor:pointer; letter-spacing:.02em; }
  .seg button + button{ border-left:1px solid var(--line-strong); }
  .seg button.active{ background:var(--brand); color:var(--brand-ink); }

  .filterbar{ display:flex; gap:8px; align-items:center; padding:9px 20px; border-bottom:1px solid var(--line); background:var(--bg-elev); flex-wrap:wrap; }
  .filterbar .lbl{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); }
  .chip{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; padding:5px 12px; border-radius:20px; border:1px solid var(--line-strong); background:var(--card); color:var(--ink-soft); cursor:pointer; }
  .chip.active{ background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }

  .shell{ display:grid; grid-template-columns:300px 1fr; min-height:0; }
  nav.chapters{ border-right:1px solid var(--line); background:var(--bg-elev); overflow-y:auto; padding:14px 10px; }
  .chapter-row{ display:flex; align-items:flex-start; gap:9px; width:100%; text-align:left; padding:10px; border-radius:9px; background:none; border:none; cursor:pointer; color:var(--ink); margin-bottom:2px; }
  .chapter-row:hover{ background:var(--card); }
  .chapter-row.active{ background:var(--brand-soft); }
  .chapter-row .num{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-faint); width:20px; flex:none; padding-top:2px; }
  .chapter-row .cname{ font-size:13px; line-height:1.3; }
  .chapter-row .csub{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; font-family:"IBM Plex Mono",monospace; }

  main.content{ overflow-y:auto; padding:24px 30px 70px; }
  .chapter-head{ max-width:820px; margin:0 auto 18px; }
  .chapter-head .kicker{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em; color:var(--gold); text-transform:uppercase; margin-bottom:4px; }
  .chapter-head h1{ font-size:23px; font-weight:650; margin:0; }

  /* ---- MCQ cards ---- */
  .mcqlist{ max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .mcq{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); }
  .mcq .srcpill{ font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:600; padding:3px 8px; border-radius:5px; background:var(--brand-soft); color:var(--brand); letter-spacing:.03em; }
  .mcq .srcpill.rtp{ background:var(--teal-soft); color:var(--teal); }
  .mcq .srcpill.mtp1{ background:var(--gold-soft); color:var(--gold); }
  .scenario{ font-size:13px; line-height:1.6; color:var(--ink-soft); background:var(--bg-elev); border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin:10px 0; }
  .scenario p{ margin:0 0 8px; } .scenario p:last-child{ margin:0; }
  .scenario.collapsed{ max-height:110px; overflow:hidden; -webkit-mask-image:linear-gradient(#000 55%, transparent); mask-image:linear-gradient(#000 55%, transparent); }
  .scentoggle{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; background:none; border:none; color:var(--brand); cursor:pointer; padding:2px 0 8px; }
  .qtext{ font-size:15px; line-height:1.55; font-weight:600; margin:8px 0 12px; }
  .opts{ display:flex; flex-direction:column; gap:8px; }
  .opt{ display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; padding:11px 13px; border:1px solid var(--line-strong); border-radius:9px; background:var(--card); color:var(--ink); cursor:pointer; font-family:inherit; font-size:13.5px; line-height:1.5; }
  .opt:hover:not(.locked){ border-color:var(--brand); }
  .opt .key{ font-family:"IBM Plex Mono",monospace; font-weight:600; flex:none; }
  .opt.locked{ cursor:default; }
  .opt.correct{ background:var(--ok-soft); border-color:var(--ok); color:var(--ink); }
  .opt.wrong{ background:var(--bad-soft); border-color:var(--bad); color:var(--ink); }
  .opt .mark{ margin-left:auto; font-weight:700; flex:none; }
  .opt.correct .mark{ color:var(--ok); } .opt.wrong .mark{ color:var(--bad); }
  .ansline{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; margin-top:10px; color:var(--ok); }

  /* ---- formula section ---- */
  .flist{ max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  .fcard{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:15px 18px; box-shadow:var(--shadow); }
  .fcard .fmeta{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .fcard .ftitle{ font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:15.5px; color:var(--brand); }
  .fcard .fbody{ font-size:14px; line-height:1.6; }
  .fcard .fbody p{ margin:7px 0; }
  .fcard .fbody ul, .fcard .fbody ol{ margin:7px 0; padding-left:20px; }
  .fcard .fbody li{ margin:4px 0; }
  .fcard .fbody table{ border-collapse:collapse; width:100%; margin:10px 0; font-size:12.5px; font-family:"IBM Plex Mono",monospace; }
  .fcard .fbody td, .fcard .fbody th{ border:1px solid var(--line-strong); padding:5px 8px; text-align:left; }
  .fcard .fbody th{ background:var(--bg-elev); }
  .fcard .fbody code, .fcard .fbody .eq{ font-family:"IBM Plex Mono",monospace; background:var(--bg-elev); border:1px solid var(--line); border-radius:6px; padding:2px 6px; }
  .fcard .fbody .eq{ display:block; padding:9px 12px; margin:8px 0; color:var(--brand); overflow-x:auto; }

  /* ---- descriptive list + reader ---- */
  .qlist{ max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  .qcard{ display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:13px 15px; cursor:pointer; box-shadow:var(--shadow); border-left:3px solid var(--line); transition:transform .12s ease; }
  .qcard:hover{ transform:translateY(-1px); border-color:var(--line-strong); }
  .qcard .qn{ font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:16px; color:var(--ink-faint); width:26px; flex:none; }
  .qcard .qmeta{ flex:1; min-width:0; }
  .qcard .row1{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .pill{ font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:500; padding:2.5px 7px; border-radius:5px; white-space:nowrap; }
  .pill.mtp2{ background:var(--brand-soft); color:var(--brand); }
  .pill.mtp1{ background:var(--gold-soft); color:var(--gold); }
  .pill.rtp{ background:var(--teal-soft); color:var(--teal); }
  .pill.marks{ background:var(--bg); color:var(--ink-soft); border:1px solid var(--line); }
  .qcard .snippet{ font-size:12px; color:var(--ink-soft); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60ch; }
  .chevron{ color:var(--ink-faint); flex:none; }

  #reader{ position:fixed; inset:0; background:var(--bg); z-index:50; display:none; flex-direction:column; }
  #reader.open{ display:flex; }
  .reader-head{ display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line); background:var(--bg-elev); flex:none; }
  .reader-head .rmeta{ flex:1; min-width:0; }
  .reader-head .rchap{ font-size:11px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace; }
  .reader-head .rtitle{ font-family:"Fraunces",Georgia,serif; font-weight:650; font-size:16px; }
  .iconbtn{ border:1px solid var(--line-strong); background:var(--card); color:var(--ink); width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; flex:none; }
  .iconbtn:hover{ border-color:var(--brand); color:var(--brand); }
  .iconbtn:disabled{ opacity:.35; cursor:default; }
  .reader-body{ flex:1; overflow-y:auto; padding:32px 22px 90px; }
  .reader-inner{ max-width:720px; margin:0 auto; }
  .rlabel{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--brand); border-bottom:2px solid var(--brand); display:inline-block; padding-bottom:3px; margin-bottom:14px; }
  .rlabel.a{ color:var(--ok); border-color:var(--ok); }
  .qbody, .abody{ font-size:15px; line-height:1.68; }
  .qbody p, .abody p{ margin:0 0 12px; }
  .qbody ul, .qbody ol, .abody ul, .abody ol{ margin:0 0 12px; padding-left:22px; }
  .qbody li, .abody li{ margin-bottom:6px; }
  .qbody table, .abody table{ border-collapse:collapse; width:100%; margin:14px 0; font-size:13px; }
  .qbody td, .qbody th, .abody td, .abody th{ border:1px solid var(--line-strong); padding:6px 9px; text-align:left; vertical-align:top; }
  .qbody th, .abody th{ background:var(--brand-soft); }
  .reveal-wrap{ text-align:center; margin:28px 0; }
  .reveal-btn{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:12px 26px; border-radius:30px; cursor:pointer; background:var(--brand); color:var(--brand-ink); border:none; box-shadow:var(--shadow); }
  .answer-block{ display:none; margin-top:8px; padding-top:22px; border-top:1px dashed var(--line-strong); }
  .answer-block.shown{ display:block; }
  .reader-nav{ position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center; gap:10px; padding:14px; background:linear-gradient(to top, var(--bg) 60%, transparent); }
  .navbtn{ font-family:"IBM Plex Mono",monospace; font-size:12px; padding:9px 18px; border-radius:24px; border:1px solid var(--line-strong); background:var(--card); color:var(--ink); cursor:pointer; }
  .navbtn:disabled{ opacity:.35; cursor:default; }

  .empty{ max-width:720px; margin:50px auto; text-align:center; color:var(--ink-soft); font-size:13px; }

  @media (max-width:860px){
    .shell{ grid-template-columns:1fr; }
    nav.chapters{ display:none; }
    nav.chapters.mobopen{ display:block; position:fixed; inset:118px 0 0 0; z-index:40; }
    .mobnav{ display:inline-flex !important; }
  }
  .mobnav{ display:none; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="stamp">A&amp;E</div>
    <div class="brandwrap">
      <div class="name">Auditing &amp; Ethics — Sep 2026</div>
      <div class="tag">CA Inter · MTP 1 + MTP 2 + RTP · chapter-wise · questions with answers</div>
    </div>
    <button class="chip mobnav" id="mobNavBtn">☰ Chapters</button>
    <div class="seg" id="modeToggle">
      <button data-mode="mcq" class="active">MCQ</button>
      <button data-mode="desc">Descriptive</button>
      <button data-mode="formula">Formula</button>
    </div>
  </header>

  <div class="filterbar" id="filterBar">
    <span class="lbl">Source</span>
    <button class="chip active" data-src="ALL">All</button>
    <button class="chip" data-src="MTP1">MTP 1</button>
    <button class="chip" data-src="MTP2">MTP 2</button>
    <button class="chip" data-src="RTP">RTP</button>
  </div>

  <div class="shell">
    <nav class="chapters" id="chapterNav"></nav>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="reader">
  <div class="reader-head">
    <button class="iconbtn" id="closeBtn">&#10005;</button>
    <div class="rmeta">
      <div class="rchap" id="rChap"></div>
      <div class="rtitle" id="rTitle"></div>
    </div>
    <button class="iconbtn" id="prevBtn">&#8592;</button>
    <button class="iconbtn" id="nextBtn">&#8594;</button>
  </div>
  <div class="reader-body">
    <div class="reader-inner">
      <div class="rlabel">Question</div>
      <div class="qbody" id="qBody"></div>
      <div class="reveal-wrap" id="revealWrap"><button class="reveal-btn" id="revealBtn">Tap to reveal answer</button></div>
      <div class="answer-block" id="answerBlock">
        <div class="rlabel a">Suggested Answer / Hint</div>
        <div class="abody" id="aBody"></div>
      </div>
    </div>
  </div>
  <div class="reader-nav">
    <button class="navbtn" id="navPrev">&#8592; Previous</button>
    <button class="navbtn" id="navNext">Next &#8594;</button>
  </div>
</div>

const DATA = JSON.parse(new TextDecoder('utf-8').decode(Uint8Array.from(atob(B64), c=>c.charCodeAt(0))));

let state = { mode:'mcq', src:'ALL', chapterIdx:0, qIdx:0 };
try{ const s = JSON.parse(localStorage.getItem('audit26_state')||'null'); if(s) state = Object.assign(state, s); }catch(e){}
function save(){ try{ localStorage.setItem('audit26_state', JSON.stringify(state)); }catch(e){} }

function groups(){
  if(state.mode==='mcq') return DATA.mcq || [];
  if(state.mode==='formula') return DATA.formula || [];
  return DATA.desc || [];
}
function srcMatch(it){ return state.src==='ALL' || it.source===state.src; }
function visibleGroups(){
  return groups().map(g => ({...g, items: g.items.filter(srcMatch)})).filter(g => g.items.length);
}
function currentGroup(){ const v = visibleGroups(); return v[Math.min(state.chapterIdx, v.length-1)] || null; }

function srcClass(s){ return s==='RTP'?'rtp':(s==='MTP1'?'mtp1':'mtp2'); }
function srcLabel(s){ return s==='RTP'?'RTP':(s==='MTP1'?'MTP 1':'MTP 2'); }

function renderNav(){
  const nav = document.getElementById('chapterNav');
  const v = visibleGroups();
  nav.innerHTML = '';
  v.forEach((g, i) => {
    const b = document.createElement('button');
    b.className = 'chapter-row' + (i===state.chapterIdx?' active':'');
    b.innerHTML = `<span class="num mono">${String(g.num).padStart(2,'0')}</span>
      <span><span class="cname">${g.name.replace(/^\d+\.\s*/,'')}</span>
      <span class="csub">${g.items.length} ${state.mode==='mcq'?'MCQ':(state.mode==='formula'?'item':'Q')}${g.items.length>1?'s':''}</span></span>`;
    b.onclick = () => { state.chapterIdx = i; state.qIdx = 0; save(); render(); document.getElementById('chapterNav').classList.remove('mobopen'); };
    nav.appendChild(b);
  });
}

function render(){
  renderNav();
  const g = currentGroup();
  const main = document.getElementById('content');
  if(!g){
    if(state.mode==='formula'){
      main.innerHTML = '<div class="empty">Formula section is empty for this filter.<br><br>Send the formula sheet file and it will be added here — organised chapter-wise, filterable by MTP&nbsp;1 / MTP&nbsp;2 / RTP just like the rest.</div>';
    } else {
      main.innerHTML = '<div class="empty">No questions for this filter.</div>';
    }
    return;
  }
  const kicker = `Chapter ${String(g.num).padStart(2,'0')} — Auditing &amp; Ethics`;
  if(state.mode==='formula'){
    const items = g.items.map(f => `<div class="fcard">
      <div class="fmeta"><span class="srcpill ${srcClass(f.source)}">${srcLabel(f.source)}</span>${f.title?`<span class="ftitle">${f.title}</span>`:''}</div>
      <div class="fbody">${f.body||''}</div></div>`).join('');
    main.innerHTML = `<div class="chapter-head"><div class="kicker">${kicker}</div><h1>${g.name.replace(/^\d+\.\s*/,'')}</h1></div><div class="flist">${items}</div>`;
    main.scrollTop = 0;
    return;
  }
  if(state.mode==='mcq'){
    main.innerHTML = `<div class="chapter-head"><div class="kicker">${kicker}</div><h1>${g.name.replace(/^\d+\.\s*/,'')}</h1></div>
      <div class="mcqlist" id="mcqlist"></div>`;
    const wrap = document.getElementById('mcqlist');
    g.items.forEach(m => wrap.appendChild(mcqEl(m)));
  } else {
    const items = g.items.map((q,i) => `<div class="qcard" data-i="${i}">
      <span class="qn mono">${i+1}</span>
      <span class="qmeta"><span class="row1">
        <span class="pill ${srcClass(q.source)}">${srcLabel(q.source)}</span>
        <span class="pill marks">${q.qno}${q.marks?' · '+q.marks+'m':''}</span>
      </span><div class="snippet">${q.q.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,110)}…</div></span>
      <span class="chevron">&#8594;</span></div>`).join('');
    main.innerHTML = `<div class="chapter-head"><div class="kicker">${kicker}</div><h1>${g.name.replace(/^\d+\.\s*/,'')}</h1></div><div class="qlist">${items}</div>`;
    main.querySelectorAll('.qcard').forEach(el => el.onclick = () => openReader(parseInt(el.dataset.i,10)));
  }
  main.scrollTop = 0;
}

function mcqEl(m){
  const d = document.createElement('div');
  d.className = 'mcq';
  const keys = ['a','b','c','d'];
  d.innerHTML = `<span class="srcpill ${srcClass(m.source)}">${srcLabel(m.source)} · MCQ ${m.n}</span>
    ${m.scenario ? `<div class="scenario collapsed" id="sc${m.n}">${m.scenario}</div><button class="scentoggle" data-sc="${m.n}">▼ Show full case scenario</button>` : ''}
    <div class="qtext">${m.q}</div>
    <div class="opts">${keys.map(k=>`<button class="opt" data-k="${k}"><span class="key">(${k})</span><span>${m.opts[k]}</span></button>`).join('')}</div>
    <div class="ansline" id="al${m.n}" hidden></div>`;
  const sc = d.querySelector('.scentoggle');
  if(sc) sc.onclick = () => {
    const box = d.querySelector('#sc'+m.n);
    box.classList.toggle('collapsed');
    sc.textContent = box.classList.contains('collapsed') ? '▼ Show full case scenario' : '▲ Hide case scenario';
  };
  d.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      if(d.querySelector('.opt.locked')) return;
      d.querySelectorAll('.opt').forEach(o => {
        o.classList.add('locked');
        if(o.dataset.k === m.correct){ o.classList.add('correct'); o.insertAdjacentHTML('beforeend','<span class="mark">✓</span>'); }
      });
      if(btn.dataset.k !== m.correct){ btn.classList.add('wrong'); btn.insertAdjacentHTML('beforeend','<span class="mark">✗</span>'); }
      const al = d.querySelector('#al'+m.n);
      al.hidden = false;
      al.textContent = 'Correct answer: (' + m.correct + ')';
    };
  });
  return d;
}

/* ---- reader (descriptive) ---- */
const reader = document.getElementById('reader');
function openReader(i){ state.qIdx = i; save(); document.body.style.overflow='hidden'; reader.classList.add('open'); renderReader(); }
function closeReader(){ reader.classList.remove('open'); document.body.style.overflow=''; }
function renderReader(){
  const g = currentGroup(); const q = g.items[state.qIdx];
  document.getElementById('rChap').textContent = g.name + '  ·  ' + srcLabel(q.source);
  document.getElementById('rTitle').textContent = `${srcLabel(q.source)} — ${q.qno}${q.marks?' ('+q.marks+' Marks)':''}`;
  document.getElementById('qBody').innerHTML = q.q;
  document.getElementById('aBody').innerHTML = q.a;
  document.getElementById('answerBlock').classList.remove('shown');
  document.getElementById('revealWrap').style.display = '';
  document.getElementById('prevBtn').disabled = state.qIdx===0;
  document.getElementById('nextBtn').disabled = state.qIdx===g.items.length-1;
  document.getElementById('navPrev').disabled = state.qIdx===0;
  document.getElementById('navNext').disabled = state.qIdx===g.items.length-1;
  document.querySelector('.reader-body').scrollTop = 0;
}
document.getElementById('revealBtn').onclick = () => {
  document.getElementById('answerBlock').classList.add('shown');
  document.getElementById('revealWrap').style.display='none';
  document.getElementById('answerBlock').scrollIntoView({behavior:'smooth',block:'start'});
};
document.getElementById('closeBtn').onclick = closeReader;
function step(d){ const g=currentGroup(); const n=state.qIdx+d; if(n<0||n>=g.items.length) return; state.qIdx=n; save(); renderReader(); }
['prevBtn','navPrev'].forEach(id=>document.getElementById(id).onclick=()=>step(-1));
['nextBtn','navNext'].forEach(id=>document.getElementById(id).onclick=()=>step(1));
document.addEventListener('keydown', e => { if(!reader.classList.contains('open')) return; if(e.key==='Escape') closeReader(); if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1); });

document.getElementById('modeToggle').onclick = e => {
  const b = e.target.closest('button[data-mode]'); if(!b) return;
  document.querySelectorAll('#modeToggle button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); state.mode = b.dataset.mode; state.chapterIdx = 0; state.qIdx = 0; save(); render();
};
document.getElementById('filterBar').onclick = e => {
  const b = e.target.closest('button[data-src]'); if(!b) return;
  document.querySelectorAll('#filterBar .chip').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); state.src = b.dataset.src; state.chapterIdx = 0; state.qIdx = 0; save(); render();
};
document.getElementById('mobNavBtn').onclick = () => document.getElementById('chapterNav').classList.toggle('mobopen');

document.querySelectorAll('#modeToggle button').forEach(x=>x.classList.toggle('active', x.dataset.mode===state.mode));
document.querySelectorAll('#filterBar .chip').forEach(x=>x.classList.toggle('active', x.dataset.src===state.src));
render();
</script>
</body>
